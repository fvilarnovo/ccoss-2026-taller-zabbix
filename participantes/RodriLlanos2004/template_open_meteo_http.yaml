zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 91a8ef6964b6498e88a3d3c655fdceeb
      name: 'Templates/Applications'
  templates:
    - uuid: 396af718d51a46649375b7ba4d020860
      template: 'Open-Meteo by HTTP'
      name: 'Open-Meteo by HTTP'
      description: 'Monitors current weather conditions using the Open-Meteo API.'
      groups:
        - name: 'Templates/Applications'
      items:
        - uuid: dffdeb1748844385b9d51a848baa68ea
          name: 'Weather: Get current conditions'
          type: HTTP_AGENT
          key: openmeteo.current.get
          delay: 15m
          history: '0'
          value_type: TEXT
          trends: '0'
          description: 'Master item: raw JSON with the current conditions from the Open-Meteo API.'
          url: 'https://api.open-meteo.com/v1/forecast'
          query_fields:
            - name: latitude
              value: '{$OPENMETEO.LATITUDE}'
            - name: longitude
              value: '{$OPENMETEO.LONGITUDE}'
            - name: current
              value: 'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,uv_index'
            - name: timezone
              value: auto
          tags:
            - tag: component
              value: raw
        - uuid: dd03f32953c54017b9c138ea1f1e12b5
          name: 'Weather: Relative humidity'
          type: DEPENDENT
          key: openmeteo.humidity
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'Relative humidity at 2 meters above ground, in %.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.relative_humidity_2m
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
        - uuid: 162ac986cce24282836e38ba39342fc0
          name: 'Weather: Temperature'
          type: DEPENDENT
          key: openmeteo.temperature
          delay: '0'
          value_type: FLOAT
          units: °C
          description: 'Air temperature at 2 meters above ground.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.temperature_2m
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
        - uuid: d3c3a97c2343433f912e806611562a2d
          name: 'Weather: Apparent temperature'
          type: DEPENDENT
          key: openmeteo.temperature.apparent
          delay: '0'
          value_type: FLOAT
          units: °C
          description: 'Apparent ("feels like") temperature, combining air temperature, humidity and wind.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.apparent_temperature
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
          triggers:
            - uuid: 6824d7a8888a4fb3b84b88d95b8fcef3
              expression: 'min(/Open-Meteo by HTTP/openmeteo.temperature.apparent,30m)>{$OPENMETEO.TEMP.APPARENT.MAX.WARN}'
              name: 'Weather: High apparent temperature'
              event_name: 'Weather: High apparent temperature (over {$OPENMETEO.TEMP.APPARENT.MAX.WARN}°C for 30m)'
              opdata: 'Feels like: {ITEM.LASTVALUE1}'
              priority: WARNING
              tags:
                - tag: scope
                  value: notice
        - uuid: 5e2306dd9cf74926bae49f769e8bc7b1
          name: 'Weather: Weather condition'
          type: DEPENDENT
          key: openmeteo.weather.code
          delay: '0'
          description: 'Current weather condition as a WMO weather code.'
          valuemap:
            name: 'WMO weather code'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.weather_code
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
        - uuid: 4d60692dbb444373b9a99f22a454231a
          name: 'Weather: Wind speed'
          type: DEPENDENT
          key: openmeteo.wind.speed
          delay: '0'
          value_type: FLOAT
          units: km/h
          description: 'Wind speed at 10 meters above ground, in km/h.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.current.wind_speed_10m
          master_item:
            key: openmeteo.current.get
          tags:
            - tag: component
              value: environment
          triggers:
            - uuid: 1393b08f969c4016b6ccaf21d2503b63
              expression: 'min(/Open-Meteo by HTTP/openmeteo.wind.speed,30m)>{$OPENMETEO.WIND.SPEED.MAX.WARN}'
              name: 'Weather: Strong wind'
              priority: AVERAGE
              tags:
                - tag: scope
                  value: notice
      tags:
        - tag: class
          value: software
        - tag: target
          value: open-meteo
      macros:
        - macro: '{$OPENMETEO.LATITUDE}'
          value: '20.97'
          description: 'Latitude of the monitored location.'
        - macro: '{$OPENMETEO.LONGITUDE}'
          value: '-89.62'
          description: 'Longitude of the monitored location.'
        - macro: '{$OPENMETEO.TEMP.APPARENT.MAX.WARN}'
          value: '40'
          description: 'Warning threshold of the apparent temperature, in °C.'
        - macro: '{$OPENMETEO.WIND.SPEED.MAX.WARN}'
          value: '50'
          description: 'Warning threshold of the wind speed, in km/h.'
      valuemaps:
        - uuid: a05bf53622b847d8a3777d43d5e3dd3d
          name: 'WMO weather code'
          mappings:
            - value: '0'
              newvalue: 'Clear sky'
            - value: '1'
              newvalue: 'Mainly clear'
            - value: '2'
              newvalue: 'Partly Cloudy'
            - value: '3'
              newvalue: Overcast
            - value: '61'
              newvalue: 'Slight rain'
            - value: '63'
              newvalue: 'Moderate rain'
            - value: '65'
              newvalue: 'Heavy rain'
            - value: '95'
              newvalue: Thunderstorm
